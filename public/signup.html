<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThriftThreads - Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h2>ThriftThreads</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="store.html">Store</a>
            <a href="sell.html">Sell</a>
            <a href="cart.html">Cart</a>
            <span id="auth-links" class="auth-group">
                <a href="login.html" class="btn-outline">Login</a>
                <a href="signup.html" class="btn-primary">Sign Up</a>
            </span>
            <span id="user-links" class="user-group hidden">
                <span id="greeting" style="margin-right: 15px;"></span>
                <button id="logout-btn" class="btn-outline">Logout</button>
            </span>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <h3>Create an Account</h3>
            <p class="error" id="error-msg">Email already exists!</p>

            <form id="signup-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password (min 6 chars)" required
                        minlength="6">
                </div>

                <button type="submit">Sign Up</button>
            </form>

            <div class="auth-bottom-links">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('signup-form').onsubmit = async function (event) {
            event.preventDefault();

            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            try {
                var response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email, password: password })
                });
                var data = await response.json();

                if (!response.ok) {
                    document.getElementById('error-msg').innerText = data.error || 'Signup failed!';
                    document.getElementById('error-msg').style.display = 'block';
                } else {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                }
            } catch (err) {
                document.getElementById('error-msg').innerText = "Server error. Please start server.js.";
                document.getElementById('error-msg').style.display = 'block';
            }
        };
    </script>

    <script>
        var currentUser = localStorage.getItem('currentUser');
        if (currentUser) {
            var user = JSON.parse(currentUser);
            var authLinks = document.getElementById('auth-links');
            if (authLinks) authLinks.classList.add('hidden');

            var userLinks = document.getElementById('user-links');
            if (userLinks) userLinks.classList.remove('hidden');

            var greeting = document.getElementById('greeting');
            if (greeting) greeting.innerText = 'Hello, ' + user.name + '!';
        }

        var logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.onclick = function (e) {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            };
        }
    </script>
</body>

</html>
